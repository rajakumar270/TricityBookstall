name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    name: Build & Test Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies (Client & Server)
        run: npm run heroku-prebuild

      - name: Verify Builds (Vite Bundling & TypeScript Compilation)
        run: npm run heroku-postbuild
